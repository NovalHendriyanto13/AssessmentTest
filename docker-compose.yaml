services:
  app:
    container_name: checkproof_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  redis:
    image: redis:latest
    container_name: redis-docker
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - /systems/conf/data:/var/lib/redis
      - /systems/conf/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DATABASES=5

  queue:
    container_name: checkproof_queue
    build:
      context: .
      target: queue
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan queue:work --queue=newUserSendEmail --sleep=3 --tries=3 --timeout=90
    depends_on:
      - app