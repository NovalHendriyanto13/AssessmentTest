services:
  api:
    container_name: sdt
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/birthdaydb
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always

  mongo:
    image: mongo
    ports:
      - "27017:27017"
